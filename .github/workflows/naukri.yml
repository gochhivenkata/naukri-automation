name: Naukri Resume Upload

on:
  schedule:
    # Runs every day at 8:00 AM IST (02:30 UTC)
    - cron: '30 2 * * *'

  workflow_dispatch:

jobs:
  upload-resume:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Show Repository Files
        run: |
          echo "Current Directory:"
          pwd
          echo ""
          echo "Repository Files:"
          find .

      - name: Verify Resume Exists
        run: |
          ls -lah resume/

      - name: Run Naukri Resume Upload
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        run: |
          python naukri.py

      - name: Upload Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            *.png
            *.html
