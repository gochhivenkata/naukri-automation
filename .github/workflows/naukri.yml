name: Naukri Automation

on:
  workflow_dispatch:

jobs:
  run-naukri:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Naukri script
        env:
          NAUKRI_EMAIL: ${{ secrets.venkata.gochhi@gmail.com }}
          NAUKRI_PASSWORD: ${{ secrets.Ril$54321 }}
        run: |
          python naukri.py
